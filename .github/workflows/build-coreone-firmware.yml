name: Build CORE One firmware (CORE One L limits)

# Builds Prusa CORE One firmware with the CORE One L's chamber limits on a
# GitHub-hosted Ubuntu 24.04 machine (the same OS as Prusa's own build container).
# The finished .bbf is attached to the run as an artifact and is also published,
# together with the full build log, on the "build-output" branch in a folder named
# after the firmware version.

on:
  push:
    branches: [main]
    paths:
      - build_coreone_L_limits.py
      - .github/workflows/build-coreone-firmware.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Prusa firmware release to build
        type: choice
        options:
          - v8.0.3-beta
          - v8.0.2
        default: v8.0.3-beta

permissions:
  contents: write # lets the last step publish the result on the build-output branch

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      BUILD_TAG: ${{ inputs.tag || 'v8.0.3-beta' }}
    steps:
      - name: Check out the build script
        uses: actions/checkout@v6

      - name: Build the firmware
        run: |
          set -o pipefail
          python3 -u build_coreone_L_limits.py --tag "$BUILD_TAG" 2>&1 | tee build.log

      - name: Attach the firmware to this run
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: coreone-L-limits-firmware-${{ env.BUILD_TAG }}
          path: |
            coreone_*_L-limits.bbf
            coreone_L_limits.diff
          if-no-files-found: error

      - name: Publish the result on the build-output branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          ver="${BUILD_TAG#v}"
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          out="$RUNNER_TEMP/build-output"
          rm -rf "$out"
          if git ls-remote --exit-code --heads "$url" build-output >/dev/null 2>&1; then
            git clone -q --depth 1 --branch build-output "$url" "$out"
          else
            mkdir -p "$out"
            git -C "$out" init -q -b build-output
          fi
          rm -rf "$out/$ver"
          mkdir -p "$out/$ver"
          cp build.log "$out/$ver/" 2>/dev/null || true
          cp coreone_*_L-limits.bbf coreone_L_limits.diff "$out/$ver/" 2>/dev/null || true
          {
            echo "status: $JOB_STATUS"
            echo "firmware: $BUILD_TAG"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "finished: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            (cd "$out/$ver" && sha256sum *.bbf 2>/dev/null) || true
          } > "$out/$ver/status.txt"
          cd "$out"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Build output for $ver (${GITHUB_SHA::7}): $JOB_STATUS"
          git push -q "$url" build-output
